#Включает параллельное выполнение тестов (true/false).
junit.jupiter.execution.parallel.enabled=true

#Режим выполнения по умолчанию: same_thread — последовательный, concurrent — параллельный.
junit.jupiter.execution.parallel.mode.default=concurrent

#Стратегия распределения потоков:
# dynamic — вычисляется автоматически (availableProcessors * dynamic.factor),
# fixed — используется фиксированное число потоков, заданное в fixed.parallelism.
junit.jupiter.execution.parallel.config.strategy=dynamic

#Фиксированное число потоков при strategy=fixed.
junit.jupiter.execution.parallel.config.fixed.parallelism=3

#Коэффициент для dynamic (используется только при strategy=dynamic).
#Пример: threads = Runtime.getRuntime().availableProcessors() * dynamic.factor
junit.jupiter.execution.parallel.config.dynamic.factor=2