name: Run tests

#trigger
on:
  push:
    branches-ignore:
      - gh-pages
  workflow_dispatch:

jobs:
  run-tests:
    name: Set up review apps and run tests
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: maven

      - name: Make scripts executable
        run: |
          chmod +x ./mvnw 
          chmod +x .swagger-coverage-commandline-1.5.0/bin/swagger-coverage-commandline

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Services
        run: bash infra/docker_compose/restart_docker.sh

      - name: Wait for backend startup
        run: bash infra/docker_compose/wait-for-backend.sh

      - name: Run tests
        run: ./mvnw clean test -q

      - name: Print Selenoid logs
        if: always()
        run: docker logs selenoid

      - name: Run Swagger coverage
        if: always()
        run: |
          .swagger-coverage-commandline-1.5.0/bin/swagger-coverage-commandline \
            -s http://localhost:4111/v3/api-docs \
            -i swagger-coverage-output

      - name: Print Docker logs on failure
        if: failure()
        run: docker compose -f infra/docker_compose/docker-compose.yml logs

      - name: Tear down services
        if: always()
        run: docker compose -f infra/docker_compose/docker-compose.yml down

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/allure-results
            swagger-coverage-output
          retention-days: 7

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare Swagger report
        if: always()
        run: |
          mkdir -p swagger-report
          cp swagger-coverage-report.html swagger-report/index.html

      - name: Upload Swagger report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swagger-report
          path: swagger-report
          if-no-files-found: error
          retention-days: 7

  allure-report:
    name: Build Allure Report
    runs-on: ubuntu-latest
    needs: run-tests
    if: ${{ always() && needs.run-tests.result != 'cancelled' }}

    steps:
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Load Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Prepare previous history
        if: always()
        run: |
          mkdir -p previous-allure-history

          if [ -d "gh-pages/allure-history" ]; then
            cp -r gh-pages/allure-history/. previous-allure-history/
          fi

      - name: Build Allure report
        uses: simple-elf/allure-report-action@v1.15
        if: always()
        with:
          gh_pages: previous-allure-history
          allure_results: allure-results
          allure_history: allure-history

      - name: Upload complete Allure history
        uses: actions/upload-artifact@v4
        with:
          name: allure-history
          path: allure-history
          if-no-files-found: error
          retention-days: 7

  publish-reports:
    name: Publish test reports
    runs-on: ubuntu-latest
    needs:
      - run-tests
      - allure-report
    if: ${{ always() && needs.allure-report.result == 'success' }}

    steps:
      - name: Download complete Allure history
        uses: actions/download-artifact@v4
        with:
          name: allure-history
          path: complete-allure-history

      - name: Download Swagger report
        uses: actions/download-artifact@v4
        with:
          name: swagger-report
          path: site/test-report/${{ github.run_number }}/swagger-coverage

      - name: Prepare Allure report and history
        run: |
          mkdir -p \
            site/test-report/${{ github.run_number }}/allure-report

          mkdir -p site/allure-history

          cp -r \
            complete-allure-history/${{ github.run_number }}/. \
            site/test-report/${{ github.run_number }}/allure-report/

          cp -r \
            complete-allure-history/. \
            site/allure-history/

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
          keep_files: true