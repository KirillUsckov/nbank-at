name: Run tests

#trigger
on: [ push, workflow_dispatch ]

jobs:
  run-tests:
    name: Set up review apps and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: maven

      - name: Set up Services
        run: bash infra/docker_compose/restart_docker.sh

      - name: Wait for backend startup
        run: bash infra/docker_compose/wait-for-backend.sh

      - name: Run tests
        run: ./mvnw clean test -q

      - name: Print Docker logs on failure
        if: failure()
        run: docker compose -f infra/docker_compose/docker-compose.yml logs

      - name: Tear down services
        if: always()
        run: docker compose -f infra/docker_compose/docker-compose.yml down

      - name: Run Swagger coverage report generation
        if: always()
        run: .swagger-coverage-commandline-1.5.0\bin\swagger-coverage-commandline -s http://backend:4111/v3/api-docs -i swagger-coverage-output

      - name: Build Swagger Coverage report
        if: always()
        run: sudo cp swagger-coverage-report.html allure-history/${{ github.run_number }}

      - name: Load allure history
        uses: actions/checkout@v2
        if: always()
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build allure report
        uses: simple-elf/allure-report-action@v1.7
        with:
          gh_pages: gh-pages
          allure_results: target/allure-results
          allure_history: allure-history

      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
