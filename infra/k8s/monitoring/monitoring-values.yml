grafana:
  enabled: true
  adminUser: "admin"
  adminPassword: "admin"
  service:
    type: NodePort
  sidecar:
    dashboards:
      enabled: true
    datasources:
      enabled: true

prometheus:
  service:
    type: NodePort
  prometheusSpec:
    serviceMonitorSelector:
      matchLabels:
        release: monitoring
    maximumStartupDurationSeconds: 300

prometheus-node-explorer:
  enabled: true

kube-state-metrics:
  enabled: true