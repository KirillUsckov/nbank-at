apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  namespace: monitoring

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
      - namespaces
      - pods
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat
subjects:
  - kind: ServiceAccount
    name: filebeat
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: filebeat

---
apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: filebeat
  namespace: monitoring
spec:
  type: filebeat
  version: 8.12.0

  elasticsearchRef:
    name: es

  kibanaRef:
    name: kb

  config:
    filebeat.inputs:
      - type: filestream
        id: backend-logs
        enabled: true

        paths:
          - /var/log/containers/backend-*.log

        prospector.scanner.symlinks: true
        prospector.scanner.fingerprint.length: 64

        parsers:
          - container: { }
    processors:
      - add_kubernetes_metadata:
          host: ${NODE_NAME}
          matchers:
            - logs_path:
                logs_path: /var/log/containers/
      - decode_json_fields:
          fields:
            - message
          target: app
          overwrite_keys: false
          add_error_key: true

  daemonSet:
    podTemplate:
      spec:
        serviceAccountName: filebeat
        automountServiceAccountToken: true

        containers:
          - name: filebeat
            securityContext:
              runAsUser: 0

            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName

            resources:
              requests:
                memory: 100Mi
                cpu: 100m
              limits:
                memory: 300Mi
                cpu: 300m

            volumeMounts:
              - name: varlogcontainers
                mountPath: /var/log/containers
                readOnly: true

              - name: varlogpods
                mountPath: /var/log/pods
                readOnly: true

              - name: varlibdockercontainers
                mountPath: /var/lib/docker/containers
                readOnly: true

              - name: filebeat-data
                mountPath: /usr/share/filebeat/data

        volumes:
          - name: varlogcontainers
            hostPath:
              path: /var/log/containers
              type: Directory

          - name: varlogpods
            hostPath:
              path: /var/log/pods
              type: Directory

          - name: varlibdockercontainers
            hostPath:
              path: /var/lib/docker/containers
              type: Directory

          - name: filebeat-data
            hostPath:
              path: /var/lib/filebeat-data
              type: DirectoryOrCreate