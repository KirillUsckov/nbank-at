apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: spring-bank-monitor
  namespace: monitoring
  labels:
    release: monitoring # Лейбл release: monitoring нужен для того, чтобы этот ServiceMonitor был обнаружен Prometheus (указано в serviceMonitorSelector).
spec:
  selector: # selector ищет сервис приложения по метке app: backend в namespace default.
    matchLabels:
      app: backend
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: http
      path: /actuator/prometheus # Prometheus опрашивает эндпоинт /actuator/prometheus каждые 15 секунд.
      interval: 15s
      basicAuth:
        username:
          name: backend-basic-auth
          key: username
        password:
          name: backend-basic-auth
          key: password