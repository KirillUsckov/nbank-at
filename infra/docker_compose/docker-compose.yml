services:
  backend:
    platform: linux/arm64/v8
    image: nobugsme/nbank:with_fraud_check_with_approve
    container_name: backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/nbank
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - FRAUD_DETECTION_SERVICE_URL=http://host.docker.internal:8080
    depends_on:
      - postgres
    ports:
      #Порт_снаружи:Порт_внутри
      - "4111:4111"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4111/health || exit 1" ]
      interval: 5s
      timeout: 1s
      retries: 3
      start_period: 5s #время, которое даем контейнеру на поднятие, после чего начинаются проверки healthcheck
    networks:
      #Общая сеть для того, чтобы сервисы взаимодействовали друг с другом
      - nbank-network

  postgres:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=nbank
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - nbank-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d nbank" ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: nobugsme/nbank-ui:preprod_version
    container_name: frontend
    expose:
      # не открываем порт наружу, а даем доступ внутри сети
      - "3000"
    depends_on:
      - backend
    networks:
      - nbank-network

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "3000:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - nbank-network

  selenoid:
    image: aerokube/selenoid:latest
    container_name: selenoid
    ports:
      - "4444:4444"
    environment:
      DOCKER_API_VERSION: "1.40"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/:/etc/selenoid/:ro
      - /dev/shm:/dev/shm
    command: ["-container-network", "nbank-network"] #Нужно, что был доступ к контейнерам браузеров, которые создает selenoid
    depends_on:
      - frontend
    networks:
      - nbank-network

  selenoid-ui:
    image: aerokube/selenoid-ui:latest
    container_name: selenoid-ui
    ports:
      - "2508:8080"
    command: [ "--selenoid-uri", "http://selenoid:4444" ] #Указываем адрес контейнера, в котором открыт селеноид
    depends_on:
      - selenoid
    networks:
      - nbank-network

networks:
  nbank-network:
    name: nbank-network

volumes:
  postgres_data:
    driver: local