apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend # связываем деплоймент и Pod (управляем только подами с label backend)
  template:
    metadata:
      labels:
        app: backend
      annotations:
        co.elastic.logs/enabled: "true"
        co.elastic.logs/module: springboot
        co.elastic.logs/json.keys_under_root: "true"
        co.elastic.logs/json.add_error_key: "true"
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:15
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: env-secrets
                  key: db.username
          command:
            - sh
            - -c
            - |
              timeout {{ .Values.db.connection.timeout }} sh -c '
                until pg_isready -h postgres -p {{ .Values.db.connection.port }}  -U "$POSTGRES_USER"; do
                echo "Waiting for Postgres..."
                sleep 2
                done
                ' || {
                echo "Postgres is unavailable after 120 seconds"
                exit 1
              }
      containers:
        - name: backend
          image: nobugsme/nbank:with_fraud_check_with_approve
          imagePullPolicy: Always
          ports:
            - containerPort: 4111
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: env-secrets
                  key: db.password
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: env-secrets
                  key: db.username
            - name: SPRING_DATASOURCE_URL
              value: {{ .Values.db.connection.url }}
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: org.postgresql.Driver
            - name: FRAUD_DETECTION_SERVICE_URL
              value: http://fraud-detection-service:8080
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 4111
            periodSeconds: 15
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 4111
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
spec:
  selector:
    app: backend # сервис будет направлять трафик на поды с app= backend
  ports:
    - name: http
      protocol: TCP
      port: 4111 # порт, на котором работает серивс
      targetPort: 4111 # куда пересылать трафик внутри пода (контейнер слушает этот порт)
  type: NodePort # ClusterIp (только внутри контейнера), nodeport - открывает порт на всех нодах для доступа извне
